# voilot Taskfile — run 'task --list' to see available tasks
#
# Local dev (hybrid): TTS/STT in Docker, frontend + backend native.
#   task dev          # starts all (frontend, backend, voice containers)
#   task dev:frontend # just the Nuxt dev server
#   task dev:backend  # just the Go backend
#   task dev:voice    # just the TTS + STT Docker containers (detached)
#   task dev:stop     # stop detached voice containers
#   task dev:tunnel   # Tailscale HTTPS serve rules (apply or tear down)
#
# Build & check:
#   task build        # compile backend + build frontend
#   task check        # go vet + nuxt typecheck
#
# Deploy:
#   task deploy           # build and deploy production stack (host-native + Docker voice)
#   task deploy:setup     # one-time macOS production setup
#   task deploy:status    # show status of production services
#   task deploy:logs      # tail production logs
#
# Agents:
#   task agents:install   # symlink voilot agents into global config (interactive backend selection)
#   task agents:uninstall # remove symlinked agents from global config
#
# Voice containers:
#   task voice        # docker compose up for TTS + STT
#   task voice:down   # tear down voice containers

version: "3"

dotenv: ['.env']

vars:
  OPENCODE_BINARY: '{{.OPENCODE_BINARY | default "opencode"}}'
  TTS_URL: '{{.TTS_URL | default "http://localhost:8880"}}'
  TTS_PROVIDER: '{{.TTS_PROVIDER | default "kokoro"}}'
  STT_URL: '{{.STT_URL | default "http://localhost:5003"}}'
  WORKSPACE_DIR: '{{.WORKSPACE_DIR | default "~/tmp/voilot-wd"}}'
  DATA_DIR: '{{.DATA_DIR | default "~/tmp/voilot-wd/voilot-data"}}'
  COMPOSE_PROJECT: '{{.VOILOT_COMPOSE_PROJECT | default "voilot"}}'

tasks:
  # ── Local development ───────────────────────────────────────────

  dev:
    desc: Start full local dev stack (frontend + backend + voice)
    deps: [dev:voice, dev:backend, dev:frontend]

  dev:setup:
    desc: One-time dev machine setup (Tailscale daemon + HTTPS serve rules only)
    cmds:
      - ./deploy/macos/setup-tailscale.sh

  dev:tunnel:
    desc: Manage Tailscale HTTPS serve rules (pass 'down' to tear down)
    cmds:
      - |
        TAILSCALE=/opt/homebrew/bin/tailscale
        if ! [ -x "$TAILSCALE" ]; then
          echo "Error: tailscale not found. Install with: brew install tailscale"
          exit 1
        fi
        if ! $TAILSCALE status >/dev/null 2>&1; then
          echo "Error: tailscaled not running. Run 'task dev:setup' first."
          exit 1
        fi
        if [ "{{.CLI_ARGS}}" = "down" ]; then
          echo "Tearing down Tailscale HTTPS serve rules..."
          $TAILSCALE serve reset
          echo "Serve rules removed."
          exit 0
        fi
        # Apply serve rules (idempotent)
        $TAILSCALE serve --bg --https=443 http://localhost:3000 2>&1 | sed 's/^/  /'
        $TAILSCALE serve --bg --https=8080 http://localhost:8080 2>&1 | sed 's/^/  /'
        echo ""
        # Print URL and QR code
        FQDN=$($TAILSCALE status --json 2>/dev/null | \
          python3 -c "import sys,json; print(json.load(sys.stdin).get('Self',{}).get('DNSName','').rstrip('.'))" 2>/dev/null)
        if [ -n "$FQDN" ]; then
          URL="https://${FQDN}"
          printf "\033]8;;%s\033\\  %s\033]8;;\033\\\n" "$URL" "$URL"
          echo ""
          if command -v qrencode >/dev/null 2>&1; then
            qrencode -t ANSIUTF8 "$URL"
            echo ""
          fi
          echo "Scan the QR code or click the link to open voilot on your phone."
        fi
        echo ""
        echo "Current serve rules:"
        $TAILSCALE serve status

  dev:frontend:
    desc: Nuxt dev server with HMR (port 3000)
    dir: frontend
    cmds:
      - npm run dev

  dev:backend:
    desc: Go backend with hot reload (port 8080)
    dir: backend
    cmds:
      - $(go env GOPATH)/bin/air --
          --tts-url {{.TTS_URL}}
          --stt-url {{.STT_URL}}
          --workspace-dir {{.WORKSPACE_DIR}}
          --data-dir {{.DATA_DIR}}

  dev:voice:
    desc: TTS + STT Docker containers only (detached)
    dir: deploy/docker
    cmds:
      - docker compose -p {{.COMPOSE_PROJECT}} --profile voice up -d tts stt

  dev:stop:
    desc: Stop detached voice containers
    dir: deploy/docker
    cmds:
      - docker compose -p {{.COMPOSE_PROJECT}} --profile voice down

  # ── Build ───────────────────────────────────────────────────────

  build:
    desc: Compile backend + build frontend
    cmds:
      - task: build:backend
      - task: build:frontend

  build:backend:
    desc: Build Go backend binary
    dir: backend
    cmds:
      - go build -o ../dist/voilot-server ./cmd/server
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - ../dist/voilot-server

  build:frontend:
    desc: Build Nuxt production server
    dir: frontend
    cmds:
      - npx nuxt build

  # ── Checks ──────────────────────────────────────────────────────

  check:
    desc: Run all checks (vet + typecheck)
    cmds:
      - task: check:backend
      - task: check:frontend

  check:backend:
    desc: Go vet + build verification
    dir: backend
    cmds:
      - go vet ./...
      - go build ./...

  check:frontend:
    desc: Nuxt typecheck
    dir: frontend
    cmds:
      - npx nuxt typecheck

  # ── Tests ───────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - task: test:backend

  test:backend:
    desc: Run Go tests
    dir: backend
    cmds:
      - go test ./...

  # ── Deploy ───────────────────────────────────────────────────────

  deploy:
    desc: Build and deploy production stack (host-native + Docker voice)
    cmds:
      - ./deploy/deploy.sh

  deploy:setup:
    desc: One-time macOS production setup (pmset, launchd, Tailscale daemon)
    cmds:
      - ./deploy/macos/setup.sh

  deploy:status:
    desc: Show status of production services
    cmds:
      - |
        echo "=== launchd services ==="
        GUI="gui/$(id -u)"
        for svc in pet.jen.voilot.backend pet.jen.voilot.frontend; do
          if launchctl print "$GUI/$svc" &>/dev/null; then
            pid=$(launchctl print "$GUI/$svc" 2>/dev/null | grep 'pid =' | awk '{print $NF}')
            echo "  ✓ $svc (pid $pid)"
          else
            echo "  ✗ $svc (not loaded)"
          fi
        done
        echo ""
        echo "=== tailscale ==="
        TAILSCALE=/opt/homebrew/bin/tailscale
        if $TAILSCALE status >/dev/null 2>&1; then
          $TAILSCALE status | head -5
          echo ""
          $TAILSCALE serve status 2>/dev/null || echo "  No serve rules configured"
        else
          echo "  ✗ tailscaled not running"
        fi
        echo ""
        echo "=== voice containers ==="
        docker compose -p {{.COMPOSE_PROJECT}} -f deploy/docker/docker-compose.yml --profile voice ps 2>/dev/null || echo "  Docker not available"
        echo ""
        echo "=== backend health ==="
        curl -sf http://localhost:8080/api/health 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "  Backend not reachable"

  deploy:logs:
    desc: Tail production logs (backend + frontend)
    cmds:
      - tail -f tmp/backend.log tmp/frontend.log

  # ── Voice containers ────────────────────────────────────────────

  voice:
    desc: Start TTS + STT Docker containers
    dir: deploy/docker
    cmds:
      - docker compose -p {{.COMPOSE_PROJECT}} --profile voice up --build -d

  voice:down:
    desc: Stop and remove voice containers
    dir: deploy/docker
    cmds:
      - docker compose -p {{.COMPOSE_PROJECT}} --profile voice down

  # ── Agents ─────────────────────────────────────────────────────

  agents:install:
    desc: Symlink voilot agents into the global config of your coding agent backend
    cmds:
      - |
        echo ""
        echo "Select your coding agent backend:"
        echo ""
        echo "  1) opencode  (~/.config/opencode/agents/)"
        echo ""
        printf "Choice [1]: "
        read -r choice
        choice="${choice:-1}"
        case "$choice" in
          1)
            TARGET_DIR="$HOME/.config/opencode/agents"
            AGENT_SRC_DIR="agents/opencode"
            BACKEND="opencode"
            ;;
          *)
            echo "Invalid choice."
            exit 1
            ;;
        esac
        echo ""
        mkdir -p "$TARGET_DIR"
        for src in "$AGENT_SRC_DIR"/*.md; do
          [ -f "$src" ] || break
          name=$(basename "$src")
          target="$TARGET_DIR/$name"
          src_abs="$(cd "$(dirname "$src")" && pwd)/$(basename "$src")"
          if [ -L "$target" ]; then
            existing=$(readlink "$target")
            if [ "$existing" = "$src_abs" ]; then
              echo "  ok   $name (already linked)"
            else
              echo "  upd  $name (relink)"
              rm "$target"
              ln -s "$src_abs" "$target"
            fi
          elif [ -f "$target" ]; then
            echo "  skip $name (regular file exists — remove manually to link)"
          else
            echo "  new  $name"
            ln -s "$src_abs" "$target"
          fi
        done
        echo ""
        echo "Agents installed for $BACKEND. Symlinked to $TARGET_DIR/"
        echo "Agent definitions live in this repo — edits here take effect immediately."
        echo ""
        echo "Installing global agent skills..."
        npx skills@latest add mattpocock/skills --skill grill-with-docs -g --agent '*' -y
        echo ""
        echo "Skills installed globally."
        echo ""
        echo "Checking for Worktrunk (git worktree manager)..."
        if command -v wt >/dev/null 2>&1; then
          echo "  ok   worktrunk already installed ($(wt --version 2>/dev/null || echo 'unknown version'))"
        else
          echo "  Installing worktrunk via Homebrew..."
          if command -v brew >/dev/null 2>&1; then
            brew install worktrunk && wt config shell install
            echo "  ok   worktrunk installed"
          else
            echo "  skip worktrunk — Homebrew not available. Install manually: https://worktrunk.dev/"
          fi
        fi
        echo ""
        echo "Ensuring workspace directory exists..."
        WORKSPACE="$HOME/tmp/voilot-wd"
        mkdir -p "$WORKSPACE"
        echo "  ok   $WORKSPACE"
        echo ""
        echo "Setup complete."
    silent: true

  agents:uninstall:
    desc: Remove symlinked voilot agents from the global config
    cmds:
      - |
        echo ""
        echo "Select your coding agent backend:"
        echo ""
        echo "  1) opencode  (~/.config/opencode/agents/)"
        echo ""
        printf "Choice [1]: "
        read -r choice
        choice="${choice:-1}"
        case "$choice" in
          1)
            TARGET_DIR="$HOME/.config/opencode/agents"
            AGENT_SRC_DIR="agents/opencode"
            BACKEND="opencode"
            ;;
          *)
            echo "Invalid choice."
            exit 1
            ;;
        esac
        echo ""
        REPO_AGENT_DIR="$(cd "$AGENT_SRC_DIR" && pwd)"
        for target in "$TARGET_DIR"/*.md; do
          [ -f "$target" ] || continue
          if [ -L "$target" ]; then
            link_dest=$(readlink "$target")
            case "$link_dest" in
              "$REPO_AGENT_DIR"/*)
                echo "  rm   $(basename "$target")"
                rm "$target"
                ;;
            esac
          fi
        done
        echo ""
        echo "Voilot agents removed from $BACKEND config."
    silent: true

  # ── Utilities ───────────────────────────────────────────────────

  install:
    desc: Install all dependencies and set up local dev environment
    cmds:
      - task: install:backend
      - task: install:frontend
      - task: install:config

  install:backend:
    desc: Download Go modules and install dev tools
    dir: backend
    cmds:
      - go mod download
      - go install github.com/air-verse/air@latest

  install:frontend:
    desc: Install npm packages
    dir: frontend
    cmds:
      - npm install

  install:config:
    desc: Create config file and data directory if missing
    cmds:
      - |
        CONFIG_DIR="$HOME/.config/voilot"
        CONFIG_FILE="$CONFIG_DIR/config.json"
        mkdir -p "$CONFIG_DIR"
        if [ -f "$CONFIG_FILE" ]; then
          echo "  ok   $CONFIG_FILE (already exists)"
        else
          cp config.example.json "$CONFIG_FILE"
          echo "  new  $CONFIG_FILE (copied from config.example.json — edit providers before running)"
        fi
        DATA="{{.DATA_DIR}}"
        DATA="${DATA/#\~/$HOME}"
        mkdir -p "$DATA"
        echo "  ok   $DATA"
