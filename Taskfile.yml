# voilot Taskfile — run 'task --list' to see available tasks
#
# Local dev (hybrid): TTS/STT in Docker, frontend + backend native.
#   task dev          # starts all (frontend, backend, voice containers, HTTPS tunnel if available)
#   task dev:frontend # just the Nuxt dev server
#   task dev:backend  # just the Go backend
#   task dev:voice    # just the TTS + STT Docker containers (detached)
#   task dev:stop     # stop detached voice containers
#   task dev:tunnel   # Tailscale HTTPS proxy (auto-skips if Tailscale unavailable)
#
# Build & check:
#   task build        # compile backend + generate frontend
#   task check        # go vet + nuxt typecheck
#
# Agents:
#   task agents:install   # symlink voilot agents into global config (interactive backend selection)
#   task agents:uninstall # remove symlinked agents from global config
#
# Docker (full stack):
#   task docker       # docker compose up --build (all services)
#   task docker:down  # tear down

version: "3"

vars:
  OPENCODE_BINARY: '{{.OPENCODE_BINARY | default "opencode"}}'
  TTS_URL: '{{.TTS_URL | default "http://localhost:8880"}}'
  TTS_PROVIDER: '{{.TTS_PROVIDER | default "kokoro"}}'
  STT_URL: '{{.STT_URL | default "http://localhost:5003"}}'
  WORKSPACE_DIR: '{{.WORKSPACE_DIR | default "~/tmp/voilot-wd"}}'
  DATA_DIR: '{{.DATA_DIR | default "~/tmp/voilot-wd/voilot-data"}}'

tasks:
  # ── Local development ───────────────────────────────────────────

  dev:
    desc: Start full local dev stack (frontend + backend + voice + tunnel)
    deps: [dev:tunnel, dev:voice, dev:backend, dev:frontend]

  dev:tunnel:
    desc: Tailscale HTTPS proxies for mobile access (pass 'down' to tear down)
    cmds:
      - |
        if ! command -v tailscale >/dev/null 2>&1; then
          echo "Warning: Tailscale not installed — skipping HTTPS tunnel. Mobile access won't work."
          exit 0
        fi
        if ! tailscale status >/dev/null 2>&1; then
          echo "Warning: Tailscale not running — skipping HTTPS tunnel. Mobile access won't work."
          exit 0
        fi
        ./scripts/tailscale-dev.sh {{.CLI_ARGS}}

  dev:frontend:
    desc: Nuxt dev server with HMR (port 3000)
    dir: frontend
    cmds:
      - npm run dev

  dev:backend:
    desc: Go backend with live flags (port 8080)
    dir: backend
    cmds:
      - go run ./cmd/server
          --opencode-binary {{.OPENCODE_BINARY}}
          --tts-url {{.TTS_URL}}
          --stt-url {{.STT_URL}}
          --workspace-dir {{.WORKSPACE_DIR}}
          --data-dir {{.DATA_DIR}}

  dev:voice:
    desc: TTS + STT Docker containers only (detached)
    dir: docker
    cmds:
      - docker compose --profile voice up -d tts stt

  dev:stop:
    desc: Stop detached voice containers
    dir: docker
    cmds:
      - docker compose --profile voice down

  # ── Build ───────────────────────────────────────────────────────

  build:
    desc: Compile backend + generate frontend static build
    cmds:
      - task: build:backend
      - task: build:frontend

  build:backend:
    desc: Build Go backend binary
    dir: backend
    cmds:
      - go build -o ../dist/voilot-server ./cmd/server
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - ../dist/voilot-server

  build:frontend:
    desc: Generate Nuxt static site
    dir: frontend
    cmds:
      - npx nuxt generate

  # ── Checks ──────────────────────────────────────────────────────

  check:
    desc: Run all checks (vet + typecheck)
    cmds:
      - task: check:backend
      - task: check:frontend

  check:backend:
    desc: Go vet + build verification
    dir: backend
    cmds:
      - go vet ./...
      - go build ./...

  check:frontend:
    desc: Nuxt typecheck
    dir: frontend
    cmds:
      - npx nuxt typecheck

  # ── Tests ───────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - task: test:backend

  test:backend:
    desc: Run Go tests
    dir: backend
    cmds:
      - go test ./...

  # ── Docker (full stack) ─────────────────────────────────────────

  docker:
    desc: Build and start full Docker Compose stack (all services)
    dir: docker
    cmds:
      - TTS_URL=http://tts:8880 STT_URL=http://stt:5003
        docker compose --profile voice up --build

  docker:down:
    desc: Stop and remove all Docker containers
    dir: docker
    cmds:
      - docker compose --profile voice down

  # ── Agents ─────────────────────────────────────────────────────

  agents:install:
    desc: Symlink voilot agents into the global config of your coding agent backend
    cmds:
      - |
        echo ""
        echo "Select your coding agent backend:"
        echo ""
        echo "  1) opencode  (~/.config/opencode/agents/)"
        echo ""
        printf "Choice [1]: "
        read -r choice
        choice="${choice:-1}"
        case "$choice" in
          1)
            TARGET_DIR="$HOME/.config/opencode/agents"
            AGENT_SRC_DIR="agents/opencode"
            BACKEND="opencode"
            ;;
          *)
            echo "Invalid choice."
            exit 1
            ;;
        esac
        echo ""
        mkdir -p "$TARGET_DIR"
        for src in "$AGENT_SRC_DIR"/*.md; do
          [ -f "$src" ] || break
          name=$(basename "$src")
          target="$TARGET_DIR/$name"
          src_abs="$(cd "$(dirname "$src")" && pwd)/$(basename "$src")"
          if [ -L "$target" ]; then
            existing=$(readlink "$target")
            if [ "$existing" = "$src_abs" ]; then
              echo "  ok   $name (already linked)"
            else
              echo "  upd  $name (relink)"
              rm "$target"
              ln -s "$src_abs" "$target"
            fi
          elif [ -f "$target" ]; then
            echo "  skip $name (regular file exists — remove manually to link)"
          else
            echo "  new  $name"
            ln -s "$src_abs" "$target"
          fi
        done
        echo ""
        echo "Agents installed for $BACKEND. Symlinked to $TARGET_DIR/"
        echo "Agent definitions live in this repo — edits here take effect immediately."
        echo ""
        echo "Installing global agent skills..."
        npx skills@latest add mattpocock/skills --skill grill-me -g --agent '*' -y
        echo ""
        echo "Skills installed globally."
        echo ""
        echo "Checking for Worktrunk (git worktree manager)..."
        if command -v wt >/dev/null 2>&1; then
          echo "  ok   worktrunk already installed ($(wt --version 2>/dev/null || echo 'unknown version'))"
        else
          echo "  Installing worktrunk via Homebrew..."
          if command -v brew >/dev/null 2>&1; then
            brew install worktrunk && wt config shell install
            echo "  ok   worktrunk installed"
          else
            echo "  skip worktrunk — Homebrew not available. Install manually: https://worktrunk.dev/"
          fi
        fi
        echo ""
        echo "Ensuring workspace directory exists..."
        WORKSPACE="$HOME/tmp/voilot-wd"
        mkdir -p "$WORKSPACE"
        echo "  ok   $WORKSPACE"
        echo ""
        echo "Setup complete."
    silent: true

  agents:uninstall:
    desc: Remove symlinked voilot agents from the global config
    cmds:
      - |
        echo ""
        echo "Select your coding agent backend:"
        echo ""
        echo "  1) opencode  (~/.config/opencode/agents/)"
        echo ""
        printf "Choice [1]: "
        read -r choice
        choice="${choice:-1}"
        case "$choice" in
          1)
            TARGET_DIR="$HOME/.config/opencode/agents"
            AGENT_SRC_DIR="agents/opencode"
            BACKEND="opencode"
            ;;
          *)
            echo "Invalid choice."
            exit 1
            ;;
        esac
        echo ""
        REPO_AGENT_DIR="$(cd "$AGENT_SRC_DIR" && pwd)"
        for target in "$TARGET_DIR"/*.md; do
          [ -f "$target" ] || continue
          if [ -L "$target" ]; then
            link_dest=$(readlink "$target")
            case "$link_dest" in
              "$REPO_AGENT_DIR"/*)
                echo "  rm   $(basename "$target")"
                rm "$target"
                ;;
            esac
          fi
        done
        echo ""
        echo "Voilot agents removed from $BACKEND config."
    silent: true

  # ── Utilities ───────────────────────────────────────────────────

  install:
    desc: Install all dependencies (Go modules + npm packages)
    cmds:
      - task: install:backend
      - task: install:frontend

  install:backend:
    desc: Download Go modules
    dir: backend
    cmds:
      - go mod download

  install:frontend:
    desc: Install npm packages
    dir: frontend
    cmds:
      - npm install
