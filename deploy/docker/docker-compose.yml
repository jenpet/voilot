# voilot voice services (TTS + STT)
#
# These run in Docker because they depend on Python + ML model stacks
# that are easier to manage as containers. The backend and frontend
# run natively on the host. See docs/adr/0001-*.md.
#
# Usage:
#   docker compose -p voilot up -d                         # Start TTS + STT
#   docker compose -p voilot --profile voice up -d         # Same (explicit profile)
#   docker compose -p voilot down                          # Stop
#
# The project name (-p voilot) can be overridden via VOILOT_COMPOSE_PROJECT.

services:
  # ── TTS: Kokoro-FastAPI ────────────────────────────────────────────
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles:
      - voice
    environment:
      - KOKORO_DEFAULT_VOICE=${KOKORO_DEFAULT_VOICE:-af_heart}
    ports:
      - "${TTS_HOST_PORT:-8880}:8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── STT: faster-whisper ────────────────────────────────────────────
  stt:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.stt
    profiles:
      - voice
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - STT_PORT=5003
    ports:
      - "${STT_HOST_PORT:-5003}:5003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - stt-models:/home/stt/.cache/huggingface
    restart: unless-stopped

volumes:
  stt-models:
    driver: local
