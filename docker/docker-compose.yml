# voilot Docker Compose stack
#
# Services:
#   frontend  - Nginx serving Nuxt static build + reverse proxy to backend
#   backend   - Go API server (REST + WebSocket)
#   tts       - Kokoro-FastAPI text-to-speech (optional, OpenAI-compatible)
#   stt       - faster-whisper speech-to-text (optional)
#
# Usage:
#   docker compose up                     # Start frontend + backend only
#   docker compose --profile voice up     # Start all services including TTS/STT
#   docker compose up --build             # Rebuild and start
#
# Local dev (hybrid): run frontend + backend locally, Docker only for TTS/STT:
#   docker compose --profile voice up tts stt
#   # Then: cd backend && go run ./cmd/server --data-dir ./voilot-data
#   # Then: cd frontend && npm run dev
#
# Configuration: The backend reads its config from config.docker.json (mounted
# into the container). Edit docker/config.docker.json to change provider
# settings, TTS/STT URLs, workspace path, etc.
#
# HTTPS: Use Tailscale for TLS termination (tailscale serve).
# See README.md for details.

services:
  # ── Frontend (Nginx + static Nuxt build) ──────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${VOILOT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Backend (Go API server) ───────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command:
      - --hostname=0.0.0.0
      - --config=/etc/voilot/config.json
      - --data-dir=/var/lib/voilot
      - --cors-origins=${CORS_ORIGINS:-}
    volumes:
      - ./config.docker.json:/etc/voilot/config.json:ro
      - ${VOILOT_WORKSPACE_DIR}:/workspace
      - voilot-data:/var/lib/voilot
    # Not exposed to host directly; nginx proxies /api/* and /ws/*
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── TTS: Kokoro-FastAPI (optional, enable with --profile voice) ────
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles:
      - voice
    environment:
      - KOKORO_DEFAULT_VOICE=${KOKORO_DEFAULT_VOICE:-af_heart}
    ports:
      - "${TTS_HOST_PORT:-8880}:8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── STT: faster-whisper (optional, enable with --profile voice) ───
  stt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.stt
    profiles:
      - voice
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - STT_PORT=5003
    ports:
      - "${STT_HOST_PORT:-5003}:5003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - stt-models:/home/stt/.cache/huggingface
    restart: unless-stopped
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  stt-models:
    driver: local
  voilot-data:
    external: true
