# voilot Docker Compose stack
#
# Services:
#   frontend  - Nginx serving Nuxt static build + reverse proxy to backend
#   backend   - Go API server (REST + WebSocket)
#   tts       - Coqui XTTSv2 text-to-speech (optional)
#   stt       - faster-whisper speech-to-text (optional)
#
# Usage:
#   docker compose up                     # Start frontend + backend only
#   docker compose --profile voice up     # Start all services including TTS/STT
#   docker compose up --build             # Rebuild and start
#
# Voice profile: When using --profile voice, set TTS/STT URLs so the backend
# can reach the sidecar services:
#   TTS_URL=http://tts:5002 STT_URL=http://stt:5003 docker compose --profile voice up

services:
  # ── Frontend (Nginx + static Nuxt build) ──────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${VOILOT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Backend (Go API server) ───────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command:
      - --opencode-url=${OPENCODE_URL:-http://host.docker.internal:4096}
      - --tts-url=${TTS_URL:-}
      - --stt-url=${STT_URL:-}
    # Not exposed to host directly; nginx proxies /api/* and /ws/*
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── TTS: Coqui XTTSv2 (optional, enable with --profile voice) ────
  tts:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tts
    profiles:
      - voice
    environment:
      - TTS_MODEL=${TTS_MODEL:-tts_models/multilingual/multi-dataset/xtts_v2}
      - TTS_PORT=5002
    expose:
      - "5002"
    volumes:
      - tts-models:/root/.local/share/tts
    restart: unless-stopped
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── STT: faster-whisper (optional, enable with --profile voice) ───
  stt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.stt
    profiles:
      - voice
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - STT_PORT=5003
    expose:
      - "5003"
    volumes:
      - stt-models:/root/.cache/huggingface
    restart: unless-stopped
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  tts-models:
    driver: local
  stt-models:
    driver: local
