# voilot Docker Compose stack
#
# Services:
#   frontend  - Nginx serving Nuxt static build + reverse proxy to backend
#   backend   - Go API server (REST + WebSocket)
#   tts       - Kokoro-FastAPI text-to-speech (optional, OpenAI-compatible)
#   stt       - faster-whisper speech-to-text (optional)
#
# Usage:
#   docker compose up                     # Start frontend + backend only
#   docker compose --profile voice up     # Start all services including TTS/STT
#   docker compose up --build             # Rebuild and start
#
# HTTPS is available on port 3443 (self-signed cert, accept browser warning).
# Required for mobile mic access over LAN: https://<lan-ip>:3443
#
# Voice profile: When using --profile voice, set TTS/STT URLs so the backend
# can reach the sidecar services:
#   TTS_URL=http://tts:8880 STT_URL=http://stt:5003 docker compose --profile voice up

services:
  # ── Frontend (Nginx + static Nuxt build) ──────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${VOILOT_PORT:-3000}:80"
      - "${VOILOT_HTTPS_PORT:-3443}:443"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Backend (Go API server) ───────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command:
      - --opencode-url=${OPENCODE_URL:-http://host.docker.internal:4096}
      - --tts-url=${TTS_URL:-}
      - --tts-provider=${TTS_PROVIDER:-kokoro}
      - --stt-url=${STT_URL:-}
    # Not exposed to host directly; nginx proxies /api/* and /ws/*
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── TTS: Kokoro-FastAPI (optional, enable with --profile voice) ────
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles:
      - voice
    environment:
      - KOKORO_DEFAULT_VOICE=${KOKORO_DEFAULT_VOICE:-af_heart}
    expose:
      - "8880"
    restart: unless-stopped

  # ── STT: faster-whisper (optional, enable with --profile voice) ───
  stt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.stt
    profiles:
      - voice
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - STT_PORT=5003
    expose:
      - "5003"
    volumes:
      - stt-models:/root/.cache/huggingface
    restart: unless-stopped
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  stt-models:
    driver: local
