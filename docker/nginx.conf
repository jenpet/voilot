# Use Docker's embedded DNS resolver so upstream names are re-resolved
# when containers are recreated (avoids stale IP caching).
resolver 127.0.0.11 valid=10s;

# ── HTTP (port 80) ──────────────────────────────────────────────────
# TLS termination is handled externally (e.g. Tailscale serve) so
# nginx only needs to serve plain HTTP inside the Docker network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_upstream http://backend:8080;

    include /etc/nginx/snippets/voilot-common.conf;
}
