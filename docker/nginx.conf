# Use Docker's embedded DNS resolver so upstream names are re-resolved
# when containers are recreated (avoids stale IP caching).
resolver 127.0.0.11 valid=10s;

# Shared upstream variable (must be in server context, duplicated below)
# Note: nginx variables set with 'set' are per-request, defined in each server block.

# ── HTTP (port 80) ──────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_upstream http://backend:8080;

    include /etc/nginx/snippets/voilot-common.conf;
}

# ── HTTPS (port 443, self-signed cert for LAN/mobile mic access) ────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/voilot.crt;
    ssl_certificate_key /etc/nginx/ssl/voilot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_upstream http://backend:8080;

    include /etc/nginx/snippets/voilot-common.conf;
}
