# voilot-common.conf — shared nginx location blocks
# Included by both HTTP and HTTPS server blocks in voilot.conf

# Use relative redirects so nginx doesn't rewrite the host/port/scheme
# in 301s (e.g. directory index redirects for /debug → /debug/).
absolute_redirect off;

# Gzip compression
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; media-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;

# Request body size limit (must accommodate STT audio uploads)
client_max_body_size 25m;

# Cache static assets aggressively
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Service worker must not be cached
location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Reverse proxy: REST API
location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for long-running requests (SSE, large responses)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Reverse proxy: WebSocket
location /ws/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket timeout (keep alive)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# SPA fallback: serve index.html for all unknown routes
location / {
    try_files $uri $uri/ /index.html;
}
